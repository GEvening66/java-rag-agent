<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java-RAG-Agent · 演示界面</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#98a2b3; --accent:#4c8dff; --ok:#31c48d; --err:#ff6b6b; --warn:#ffb020;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .sub{color:var(--dim);font-size:12.5px}
  .grow{flex:1}
  main{max-width:900px;margin:0 auto;padding:20px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  select,input,textarea,button{font:inherit;color:var(--fg);background:var(--panel2);
         border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  button{cursor:pointer;background:var(--panel2)}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
  .chips button{font-size:12.5px;padding:5px 10px;color:var(--dim)}
  #log{display:flex;flex-direction:column;gap:14px;min-height:180px}
  .msg{display:flex;gap:10px}
  .msg .who{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;
            font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
  .msg.user .who{background:#22304a;border-color:#2f4a75}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:11px 14px;white-space:pre-wrap;word-break:break-word;max-width:100%}
  .msg.user .bubble{background:#182234;border-color:#26395c}
  .bubble.err{border-color:#5a2a2a;background:#241a1a;color:#ffc9c9}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;
        color:var(--dim);font-size:12px;font-family:ui-monospace,Consolas,monospace}
  .cite{background:#1b2a1f;border:1px solid #2c4a35;color:#8ee0b0;border-radius:6px;padding:1px 6px}
  .typing::after{content:"…";animation:dots 1.2s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  #composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);
            padding:14px 0 6px;margin-top:14px}
  .inputbar{display:flex;gap:8px;align-items:flex-end;background:var(--panel);
            border:1px solid var(--line);border-radius:12px;padding:8px}
  .inputbar textarea{flex:1;border:none;background:transparent;resize:none;max-height:140px;
            padding:6px 4px}
  .inputbar textarea:focus{border:none}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;
         max-width:620px;width:92%}
  dialog::backdrop{background:#0009}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;
      overflow:auto;font-size:12px;max-height:52vh}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--err)}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:6px 0 22px}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>Java-RAG-Agent</h1>
    <span class="sub">混合检索（向量+BM25+RRF）→ 重排 → 引用校验 / 工具调用 / 质检 Agent</span>
    <span class="grow"></span>
    <a class="sub" href="/docs" target="_blank">API 文档</a>
    <button id="btnMetrics" class="sub" style="padding:3px 8px">指标</button>
  </div>
  <div class="row" style="margin-top:6px">
    <span class="dot" id="dot"></span><span class="sub" id="stat">连接中…</span>
  </div>
</header>

<main>
  <!-- 示例题按"难度/风格"选，每题对应一个可讲的点（错别字容错 / 口语化 / 堆栈符号 / 拒答） -->
  <div class="chips">
    <button data-q="HashMap 的默认负载因子是多少？">easy · HashMap 负载因子</button>
    <button data-q="volatlie 能保证原子行吗">hard · 错别字</button>
    <button data-q="jvm 新生代的 minor gc 什么时候发生">hard · 口语化</button>
    <button data-q="java.lang.StackOverflowError 一般是什么原因导致">hard · 堆栈</button>
    <button data-q="Spring Boot 怎么配置数据源？">知识库外 · 应拒答</button>
  </div>

  <div id="log"></div>

  <div id="composer">
    <div class="row" style="margin-bottom:8px">
      <select id="mode" title="链路模式">
        <option value="rag" selected>基础 RAG（最快，约 2-3 秒）</option>
        <option value="tool">工具调用 Agent（function calling）</option>
        <option value="qa">质检 Agent（多 Agent 编排，约 10 秒）</option>
      </select>
      <input id="uid" placeholder="用户 ID（填了才启用长期记忆）" style="flex:1;min-width:180px">
      <button id="btnClear">清空对话</button>
    </div>
    <div class="inputbar">
      <textarea id="q" rows="1" placeholder="问一个 Java 问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="primary" id="send">发送</button>
    </div>
  </div>
  <footer>引用编号对应检索到的知识块 · trace_id 可在 logs/traces.jsonl 中回查每一步工具调用</footer>
</main>

<dialog id="dlg">
  <div class="row"><strong>可观测指标</strong><span class="grow"></span>
    <button onclick="document.getElementById('dlg').close()">关闭</button></div>
  <pre id="metricsBody">加载中…</pre>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const log = $('#log');
let busy = false;

/* 所有文本一律用 textContent 写入：模型回答里若含 <script> 也不会执行（防 XSS） */
function bubble(who, text, cls) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + who;
  const avatar = document.createElement('div');
  avatar.className = 'who';
  avatar.textContent = who === 'user' ? '我' : 'AI';
  const body = document.createElement('div');
  body.className = 'bubble' + (cls ? ' ' + cls : '');
  body.textContent = text;
  wrap.append(avatar, body);
  log.append(wrap);
  scrollDown();
  return body;
}

function scrollDown(){ window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'}); }

function addMeta(box, data) {
  const meta = document.createElement('div');
  meta.className = 'meta';
  const lat = document.createElement('span');
  lat.textContent = `${data.latency_ms} ms`;
  const m = document.createElement('span');
  m.textContent = `链路 ${data.mode}`;
  meta.append(lat, m);
  (data.citations || []).forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'cite';
    chip.textContent = `引用 #${c}`;
    meta.append(chip);
  });
  if (data.trace_id) {
    const tr = document.createElement('span');
    tr.textContent = `trace ${data.trace_id}`;
    tr.title = '到 logs/traces.jsonl 按该 id 回查';
    meta.append(tr);
  }
  box.append(meta);
  scrollDown();
}

async function ask() {
  const q = $('#q').value.trim();
  if (!q || busy) return;
  busy = true;
  $('#send').disabled = true;
  bubble('user', q);
  $('#q').value = '';
  $('#q').style.height = 'auto';
  const box = bubble('bot', '检索并生成中', 'typing');
  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question: q,
        mode: $('#mode').value,
        user_id: $('#uid').value.trim() || null      // 空串 → null，不启用记忆
      })
    });
    const data = await resp.json();
    box.classList.remove('typing');
    if (!resp.ok) {
      box.classList.add('err');
      box.textContent = `HTTP ${resp.status}｜${data.detail || '未知错误'}`;
    } else {
      box.textContent = data.answer;
      addMeta(box, data);
    }
  } catch (e) {
    box.classList.remove('typing');
    box.classList.add('err');
    box.textContent = '网络错误：' + e.message;
  } finally {
    busy = false;
    $('#send').disabled = false;
    $('#q').focus();
    scrollDown();
  }
}

$('#send').onclick = ask;
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
$('#q').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
});
$('#btnClear').onclick = () => { log.replaceChildren(); };
document.querySelectorAll('.chips button').forEach(b => {
  b.onclick = () => { $('#q').value = b.dataset.q; ask(); };
});
$('#btnMetrics').onclick = async () => {
  $('#dlg').showModal();
  try {
    const r = await fetch('/metrics');
    $('#metricsBody').textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) { $('#metricsBody').textContent = '指标读取失败：' + e.message; }
};

/* 启动时探活：把索引规模与检索配置显示出来（面试演示时一眼看到系统状态） */
(async () => {
  try {
    const h = await (await fetch('/health')).json();
    $('#dot').classList.add('ok');
    $('#stat').textContent =
      `就绪 · ${h.chunks} 块 · ${h.hybrid ? '混合检索' : '纯向量'}` +
      `${h.rerank ? ' + cross-encoder 重排' : ''} · top${h.top_k}（召回 ${h.recall_k}）· ${h.model}`;
  } catch (e) {
    $('#dot').classList.add('bad');
    $('#stat').textContent = '服务不可用（检查 uvicorn 是否在跑）';
  }
})();
</script>
</body>
</html>
